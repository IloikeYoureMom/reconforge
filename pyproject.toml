[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "reconforge"
version = "1.0.0"
description = "Automated Cyber Reconnaissance Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0",
    "dnspython>=2.0",
]

[project.scripts]
reconforge = "reconforge.__main__:main"

[tool.setuptools.packages.find]
include = ["reconforge*"]
